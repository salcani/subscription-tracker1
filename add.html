
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Subscription</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/salcani/subscription-tracker1@main/css-library/css-library.css">
</head>
<body>

    <!-- Header and Navigation -->
    <header class="header">
        <div class="container nav">
            <h2>Subscription Tracker</h2>

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="add.html">Add Subscription</a></li>
                    <li><a href="subscriptions.html">Subscriptions</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Add Subscription Form -->
    <main class="container">
        <section class="section">
            <h1>Add a New Subscription</h1>

            <form id="subscriptionForm" class="card">

                <div class="form-group">
                    <label for="service">Service</label>
                    <input type="text" id="service" class="form-control"
                           placeholder="e.g. Netflix" required>
                </div>

                <div class="form-group">
                    <label for="provider">Provider</label>
                    <input type="text" id="provider" class="form-control"
                           placeholder="e.g. Netflix Inc." required>
                </div>

                <div class="form-group">
                    <label for="subscriber">Subscriber</label>
                    <input type="text" id="subscriber" class="form-control"
                           placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="renewalDate">Renewal Date</label>
                    <input type="date" id="renewalDate" class="form-control"
                           required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" class="form-control" required>
                        <option value="">Select a category</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Music">Music</option>
                        <option value="Software">Software</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <p id="formMessage"></p>

                <button type="submit" class="btn btn-primary">
                    Save Subscription
                </button>

            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/gh/salcani/subscription-tracker1@main/js-library/js-library.js"></script>
   

</body>
</html>
